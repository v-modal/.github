<svg width="1080" height="200" viewBox="0 0 1080 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How V-Modal works: upload, index, query, jump to moment">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1080" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#101A38"/>
    </linearGradient>
    <linearGradient id="pacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#3DDCB4"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4EA8FF"/>
    </marker>
  </defs>

  <rect width="1080" height="200" rx="14" fill="url(#pbg)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Step 1 -->
    <rect x="40" y="50" width="200" height="100" rx="12" fill="#141C3A" stroke="#2A3766" stroke-width="1.5"/>
    <text x="140" y="90" font-size="26" fill="#F4F6FF">📱 🎥</text>
    <text x="140" y="118" font-size="16" font-weight="700" fill="#F4F6FF">Upload</text>
    <text x="140" y="138" font-size="12.5" fill="#8B96C9">chunked, signed, resumable</text>

    <line x1="248" y1="100" x2="300" y2="100" stroke="#4EA8FF" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- Step 2 -->
    <rect x="308" y="50" width="200" height="100" rx="12" fill="#141C3A" stroke="#2A3766" stroke-width="1.5"/>
    <text x="408" y="90" font-size="26" fill="#F4F6FF">🧠</text>
    <text x="408" y="118" font-size="16" font-weight="700" fill="#F4F6FF">Index</text>
    <text x="408" y="138" font-size="12.5" fill="#8B96C9">frames + context, multimodal</text>

    <line x1="516" y1="100" x2="568" y2="100" stroke="#4EA8FF" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- Step 3 -->
    <rect x="576" y="50" width="200" height="100" rx="12" fill="#141C3A" stroke="#2A3766" stroke-width="1.5"/>
    <text x="676" y="90" font-size="26" fill="#F4F6FF">💬 🖼️</text>
    <text x="676" y="118" font-size="16" font-weight="700" fill="#F4F6FF">Query</text>
    <text x="676" y="138" font-size="12.5" fill="#8B96C9">text, image or video</text>

    <line x1="784" y1="100" x2="836" y2="100" stroke="#4EA8FF" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- Step 4 -->
    <rect x="844" y="50" width="200" height="100" rx="12" fill="#141C3A" stroke="url(#pacc)" stroke-width="2"/>
    <text x="944" y="90" font-size="26" fill="#F4F6FF">⏱️</text>
    <text x="944" y="118" font-size="16" font-weight="700" fill="#F4F6FF">Exact moment</text>
    <text x="944" y="138" font-size="12.5" fill="#8B96C9">jump to the timestamp</text>
  </g>
</svg>
